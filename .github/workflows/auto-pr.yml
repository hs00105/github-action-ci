name: Auto PR Management

on:
  create:
  delete:

jobs:
  create-pr:
    if: github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for existing PR
        id: check_pr
        uses: actions/github-script@v6
        with:
          script: |
            const branch = context.ref.replace('refs/heads/', '');
            const { data: pullRequests } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:${branch}`
            });
            if (pullRequests.length > 0) {
              console.log('Existing pull request found:', pullRequests[0].html_url);
              return { prExists: true, prUrl: pullRequests[0].html_url };
            } else {
              console.log('No existing pull request found.');
              return { prExists: false };
            }

      - name: Fail if PR exists
        if: steps.check_pr.outputs.prExists == 'true'
        run: |
          echo "A pull request already exists: ${{ steps.check_pr.outputs.prUrl }}"
          exit 1
          
      - name: Create Pull Request
        if: steps.check_pr.outputs.prExists != 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: ${{ github.ref_name }}
          title: 'Auto PR for ${{ github.ref_name }}'
          body: 'This PR was automatically created for branch ${{ github.ref_name }}.'

  close-pr:
    if: github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - name: Close PRs for deleted branch
        uses: actions/github-script@v6
        with:
          script: |
            const branch = context.payload.ref;
            const { data: pullRequests } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:${branch}`
            });
            for (const pr of pullRequests) {
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                state: 'closed'
              });
              console.log(`Closed PR #${pr.number} for deleted branch ${branch}`);
            }
